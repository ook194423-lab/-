<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الدروس ١ إلى ٥</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
</head>
<body>
<script>
/* حزمة الدروس ١ إلى ٥ — لا تحتاج تعدّل هذا الملف إلا لتصحيح محتوى الدروس */
window.PACK = {
 id: "b1", title: "الدروس ١ إلى ٥", base: 0,
 endNote: "خلصت الدروس ١ إلى ٥. ارجع للقناة لاختبار المراجعة، ثم الحزمة التالية.",
 lessons: [
 { id:"l1", title:"الدرس ١: العائلة", words:["father","mother","brother","son","daughter"],
   en:"This is my family. My father is a teacher and my mother is a nurse. I am their son. I have a brother and a sister. My sister is their daughter. We live in a big house. We are happy.",
   ar:"هذه عائلتي. أبي معلم وأمي ممرضة. أنا ابنهم. عندي أخ وأخت. أختي هي ابنتهم. نسكن في بيت كبير. نحن سعداء.",
   quiz:[
    {t:"ما معنى {{father}}؟", o:["أب","أم","ابن","أخ"], a:0, e:"«father» تعني أب. وأمك هي mother."},
    {t:"ما معنى {{daughter}}؟", o:["ابنة","ابن","جدة","أم"], a:0, e:"«daughter» تعني ابنة، والابن هو son."},
    {t:"المقابل (ذكر/أنثى) لكلمة {{son}}:", o:["daughter","mother","brother","father"], a:0, e:"المقابل للابن (son) هو الابنة (daughter)."},
    {t:"أكمل الجملة: {{My father's wife is my ___.}}", o:["mother","daughter","son","brother"], a:0, e:"زوجة أبي هي أمي، يعني mother."},
    {t:"ما معنى {{brother}}؟", o:["أخ","عم","ابن","جار"], a:0, e:"«brother» تعني أخ. أما ابن العم أو الخال فهو cousin."}
   ]},
 { id:"l2", title:"الدرس ٢: الأكل", words:["bread","cheese","egg","milk","rice"],
   en:"For breakfast, I eat bread and cheese. My brother has an egg and a glass of milk. For lunch, we eat rice with chicken. I like our food.",
   ar:"على الفطور آكل خبزاً وجبناً. أخي يأكل بيضة ويشرب كوب حليب. على الغداء نأكل أرزاً مع دجاج. أحب طعامنا.",
   quiz:[
    {t:"ما معنى {{cheese}}؟", o:["جبن","خبز","بيضة","أرز"], a:0, e:"«cheese» تعني جبن. والخبز هو bread."},
    {t:"ما معنى {{milk}}؟", o:["حليب","ماء","عصير","سكر"], a:0, e:"«milk» تعني حليب. والماء هو water."},
    {t:"أكمل الجملة: {{I drink a glass of ___.}}", o:["milk","bread","cheese","rice"], a:0, e:"نقول a glass of milk (كوب حليب)، ولا نقول كوب خبز أو جبن."},
    {t:"أكمل الجملة: {{An ___ comes from a chicken.}}", o:["egg","rice","bread","cheese"], a:0, e:"«an» تأتي قبل الكلمات اللي تبدأ بصوت حرف علة مثل egg، والبيضة تأتي من الدجاجة."},
    {t:"ما معنى {{rice}}؟", o:["أرز","خبز","جبن","بيضة"], a:0, e:"«rice» تعني أرز. والخبز bread والجبن cheese."}
   ]},
 { id:"l3", title:"الدرس ٣: الأضداد", words:["big","small","hot","cold","new"],
   en:"I live in a big house. My room is small, but I like it. My school is new. In summer, it is hot. In winter, it is cold.",
   ar:"أسكن في بيت كبير. غرفتي صغيرة لكني أحبها. مدرستي جديدة. في الصيف الجو حار. في الشتاء الجو بارد.",
   quiz:[
    {t:"ضد {{big}}:", o:["small","hot","cold","new"], a:0, e:"ضد big (كبير) هو small (صغير)."},
    {t:"ضد {{hot}}:", o:["cold","big","small","new"], a:0, e:"ضد hot (حار) هو cold (بارد)."},
    {t:"ما معنى {{new}}؟", o:["جديد","قديم","كبير","صغير"], a:0, e:"«new» تعني جديد، وضدها old (قديم)."},
    {t:"أكمل الجملة: {{An elephant is ___, but a cat is small.}}", o:["big","hot","cold","new"], a:0, e:"الفيل كبير (big) والقطة صغيرة (small)، فالجملة فيها تضاد."},
    {t:"أكمل الجملة: {{Tea is hot, but ice is ___.}}", o:["cold","big","small","new"], a:0, e:"الشاي حار (hot) لكن الثلج بارد (cold)."}
   ]},
 { id:"l4", title:"الدرس ٤: أيام الأسبوع", words:["Sunday","Monday","Friday","today","tomorrow"],
   en:"Today is Sunday. Tomorrow is Monday, and I go to school. On Friday, I do not go to school. I visit my uncle on Friday.",
   ar:"اليوم هو الأحد. غداً الاثنين، وأذهب إلى المدرسة. يوم الجمعة لا أذهب إلى المدرسة. أزور عمي يوم الجمعة.",
   quiz:[
    {t:"ما معنى {{tomorrow}}؟", o:["غداً","أمس","اليوم","الليلة"], a:0, e:"«tomorrow» تعني غداً. وأمس هي yesterday، واليوم today."},
    {t:"ما معنى {{Friday}}؟", o:["يوم الجمعة","يوم الأحد","يوم الاثنين","يوم السبت"], a:0, e:"«Friday» تعني يوم الجمعة. وSunday هو الأحد وMonday هو الاثنين."},
    {t:"أكمل الجملة: {{Today is Sunday. Tomorrow is ___.}}", o:["Monday","Friday","Sunday","Saturday"], a:0, e:"بعد Sunday (الأحد) يأتي Monday (الاثنين)."},
    {t:"ما معنى {{today}}؟", o:["اليوم","غداً","أمس","الليلة"], a:0, e:"«today» تعني اليوم. وغداً هي tomorrow."},
    {t:"ما معنى {{Sunday}}؟", o:["يوم الأحد","يوم الجمعة","يوم الاثنين","يوم السبت"], a:0, e:"«Sunday» تعني يوم الأحد."}
   ]},
 { id:"l5", title:"الدرس ٥: الناس والمهن", words:["doctor","nurse","student","driver","teacher"],
   en:"My uncle is a doctor and his wife is a nurse. They work in a hospital. My friend Ali is a student. His father is a driver, and his mother is a teacher.",
   ar:"عمي طبيب وزوجته ممرضة. يعملان في مستشفى. صديقي علي طالب. أبوه سائق وأمه معلمة.",
   quiz:[
    {t:"ما معنى {{doctor}}؟", o:["طبيب","معلم","سائق","طالب"], a:0, e:"«doctor» تعني طبيب. والمعلم هو teacher."},
    {t:"أكمل الجملة: {{A ___ drives a bus.}}", o:["driver","student","nurse","teacher"], a:0, e:"السائق (driver) هو الذي يقود. وفعل يقود هو drive."},
    {t:"أكمل الجملة: {{A ___ teaches students at school.}}", o:["teacher","doctor","driver","nurse"], a:0, e:"المعلم (teacher) هو الذي يعلّم الطلاب."},
    {t:"ما معنى {{nurse}}؟", o:["ممرض / ممرضة","طبيب","سائق","طالب"], a:0, e:"«nurse» تعني ممرض أو ممرضة، وتعمل مع الطبيب في المستشفى."},
    {t:"المقابل لـ {{teacher}} في الصف:", o:["student","doctor","driver","nurse"], a:0, e:"المعلم (teacher) يعلّم، والطالب (student) يتعلم."}
   ]}
 ]
};
</script>
<script src="app.js"></script>
</body>
</html>
