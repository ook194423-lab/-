<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلّم الكلمات</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#EDF2F5; --surface:#FFFFFF; --ink:#13242C; --muted:#5B6B73; --line:#D5DEE3;
  --accent:#2457D6; --accent-ink:#FFFFFF; --hi:#FFE9A8; --ok:#1E7A4F; --okbg:#DDF2E7; --bad:#B3261E; --badbg:#FBE3E1;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0F1A20; --surface:#17262E; --ink:#E8F0F3; --muted:#9BB0BA; --line:#26404B;
    --accent:#7FA2FF; --accent-ink:#0B1633; --hi:#5A4C12; --ok:#58C48F; --okbg:#17352A; --bad:#FF8A80; --badbg:#3A1D1B;
  }
}
:root[data-theme="dark"] {
  --bg:#0F1A20; --surface:#17262E; --ink:#E8F0F3; --muted:#9BB0BA; --line:#26404B;
  --accent:#7FA2FF; --accent-ink:#0B1633; --hi:#5A4C12; --ok:#58C48F; --okbg:#17352A; --bad:#FF8A80; --badbg:#3A1D1B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;padding-bottom:110px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 0}
h1{font-size:26px;line-height:1.3;margin:6px 0 4px;font-weight:700}
h2{font-size:19px;margin:26px 0 6px;font-weight:700}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.count{font-size:14px;color:var(--muted);margin:0 0 6px}
button{font-family:inherit}
.link{background:none;border:0;color:var(--accent);font-size:15px;cursor:pointer;padding:8px 2px}
.link:focus-visible,.go:focus-visible,.sec:focus-visible,.ib:focus-visible,.opt:focus-visible,.pill:focus-visible,.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ol.lessons{list-style:none;margin:6px 0 0;padding:0;border-top:2px solid var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 8px;color:var(--ink);font-size:18px;cursor:pointer}
.row small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.tag{font-size:14px;color:var(--muted);white-space:nowrap}
.tag.done{color:var(--ok);font-weight:700}
.tag.next{color:var(--accent);font-weight:700}
.cta{display:block;width:100%;text-align:start;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:18px 18px;font-size:21px;font-weight:700;cursor:pointer}
.cta small{display:block;font-size:15px;font-weight:400;margin-top:4px;opacity:.9;text-align:right}
.cta:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rand{margin-top:8px;width:100%;height:54px;border-radius:12px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-size:18px;font-weight:700;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
.steps{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pill.past{color:var(--ink);border-color:var(--ink)}
.pill:disabled{opacity:.45;cursor:default}
ol.words{list-style:none;margin:8px 0 0;padding:0;border-top:2px solid var(--ink)}
ol.words li{border-bottom:1px solid var(--line);padding:16px 8px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.en{font-size:30px;font-weight:700;line-height:1.2;direction:ltr;text-align:right;unicode-bidi:isolate;word-break:break-word}
.mean{font-size:19px;margin-top:2px}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.ib{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center;padding:0;grid-row:1 / span 2;grid-column:2}
details{grid-column:1 / -1;font-size:15px;color:var(--muted);margin-top:6px}
summary{cursor:pointer;color:var(--accent);list-style:none;font-size:14px}
summary::-webkit-details-marker{display:none}
details p{margin:6px 0 0;direction:rtl}
.passage{direction:ltr;text-align:left;font-size:23px;line-height:1.75;margin:10px 0;padding:6px 2px}
.passage mark{background:var(--hi);color:inherit;padding:0 3px;border-radius:3px}
.tools{display:flex;gap:10px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.pbtn{height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;cursor:pointer}
.tr{margin-top:10px;padding:12px 14px;background:var(--surface);border-inline-start:4px solid var(--accent);font-size:18px}
.note{margin:0 0 12px;color:var(--muted);font-size:15px}
.qcount{font-size:14px;color:var(--muted);margin:6px 0 8px}
.qt{font-size:21px;line-height:1.6;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:start;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.why{margin-top:14px;padding:12px 14px;border-inline-start:4px solid var(--bad);background:var(--badbg);font-size:17px;line-height:1.7}
.result{font-size:28px;font-weight:700;margin:20px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px;direction:ltr}
.chip{background:var(--hi);padding:6px 12px;border-radius:999px;font-size:18px;font-weight:700}
.wi{display:block;text-align:center;text-decoration:none;height:54px;line-height:54px;border-radius:12px;background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:18px}
.wi:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.task{margin:16px 0 0;padding:12px 14px;border-inline-start:4px solid var(--accent);background:var(--surface);font-size:15px}
.dock{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.go{flex:1;height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.sec{height:52px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;cursor:pointer}
.toast{position:fixed;inset-inline:0;bottom:92px;display:flex;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s}
.toast span{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:15px}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden><div class="in">
  <button class="sec" id="sec" type="button" hidden></button>
  <button class="go" id="go" type="button"></button>
</div></div>
<div class="toast" id="toast"><span></span></div>

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function rand(n){ return Math.floor(Math.random()*n); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- سحب الكلمات العشوائية (بدون تكرار حتى يخلص القسم) ---------- */
function drawRandom(){
  const learned = new Set(prog.learned), seen = new Set(prog.seen);
  const picked = [];
  for (const cat of shuffle(cats.slice())){
    if (picked.length === PER) break;
    let p = byCat[cat].filter(i => !learned.has(i) && !seen.has(i));
    if (!p.length){ byCat[cat].forEach(i => seen.delete(i)); p = byCat[cat].filter(i => !learned.has(i)); }
    if (p.length) picked.push(p[rand(p.length)]);
  }
  if (picked.length < PER){
    const rest = []; for (let i=0;i<DATA.length;i++) if (!learned.has(i) && !picked.includes(i)) rest.push(i);
    shuffle(rest); while (picked.length < PER && rest.length) picked.push(rest.pop());
  }
  picked.forEach(i => seen.add(i));
  prog.seen = [...seen]; saveProg();
  return picked;
}

/* ---------- توليد اختبار تلقائي للكلمات العشوائية ---------- */
function genQuiz(idxs){
  const qs = [];
  idxs.forEach(i => {
    const d = DATA[i];
    const others = byCat[d.c].filter(j => j !== i && DATA[j].m !== d.m);
    const ms = []; shuffle(others.slice()).forEach(j => { if (ms.length < 3 && !ms.includes(DATA[j].m)) ms.push(DATA[j].m); });
    if (ms.length === 3) qs.push({t:'ما معنى '+L(d.w)+'؟', o:[d.m].concat(ms), a:0, e:'«'+d.w+'» تعني '+d.m+'.'+(d.n ? ' ملاحظة: '+d.n : '')});
  });
  let n = 0;
  shuffle(idxs.slice()).forEach(i => {
    const d = DATA[i], ant = ANT[d.w];
    if (!ant || n >= 2) return;
    const ws = []; shuffle(byCat[d.c].slice()).forEach(j => {
      const w = DATA[j].w; if (ws.length < 3 && w !== d.w && w !== ant && !ws.includes(w)) ws.push(w);
    });
    if (ws.length === 3){ qs.push({t:'ضد '+L(d.w)+':', o:[ant].concat(ws), a:0, e:'ضد «'+d.w+'» هو «'+ant+'».'}); n++; }
  });
  return qs;
}

function startFixed(lesson){
  const idxs = lesson.words.map(findIdx).filter(i => i >= 0);
  S = {kind:"fixed", id:lesson.id, title:lesson.title, idxs, en:lesson.en, ar:lesson.ar,
       steps:["words","text","quiz","write"], step:0, quiz:prepQuiz(lesson.quiz.map((q,i) => Object.assign({}, q, {e:(EXPL[lesson.id]||[])[i]}))), qi:0, score:0, picked:-1, finished:false, showTr:false};
  renderLesson();
}
function startRandom(){
  const idxs = drawRandom();
  S = {kind:"random", id:null, title:"٥ كلمات عشوائية", idxs, en:null, ar:null,
       steps:["words","quiz","write"], step:0, quiz:prepQuiz(genQuiz(idxs)), qi:0, score:0, picked:-1, finished:false, showTr:false};
  renderLesson();
}
function prepQuiz(qs){
  return qs.map(q => {
    const order = shuffle(q.o.map((_,i) => i));
    return {t:q.t, o:order.map(i => q.o[i]), a:order.indexOf(q.a), e:q.e};
  });
}

function setDock(primary, onPrimary, disabled, secondary, onSecondary){

function highlight(text, words){
  let h = esc(text);
  words.forEach(w => { h = h.replace(new RegExp("\\b("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")\\b","gi"), "<mark>$1</mark>"); });
  return h;
}

        (S.score === S.quiz.length ? 'ممتاز، كلها صحيحة.' : (S.score >= S.quiz.length-1 ? 'قريب جداً. راجع الكلمة اللي غلطت فيها.' : 'عادي. ارجع للكلمات وأعد الاختبار.'))+'</p>';
    } else {
      html += '<p class="note">الاختبار بدون رجوع للكلمات، عشان تعرف مستواك الحقيقي.</p><p class="qcount">سؤال '+(S.qi+1)+' من '+S.quiz.length+'</p><p class="qt">'+q.t+'</p><div class="opts">'+
        q.o.map((o,i) => {
          let cls = "opt"; if (S.picked >= 0){ if (i === q.a) cls += " ok"; else if (i === S.picked) cls += " no"; }
          return '<button class="'+cls+'" data-o="'+i+'" type="button"'+(S.picked>=0?' disabled':'')+'><span dir="auto">'+esc(o)+'</span></button>';
        }).join("")+'</div>'+
        ((S.picked >= 0 && S.picked !== q.a && q.e) ? '<div class="why"><b>الصحيح:</b> <span dir="auto">'+esc(q.o[q.a])+'</span><br>'+esc(q.e)+'</div>' : '');
    }
  }

  if (key === "write"){
    html += '<p class="note">آخر خطوة: اكتب بنفسك. افتح Write &amp; Improve واكتب نصاً قصيراً (٣ إلى ٥ جمل) فيه هذي الكلمات:</p>'+
      '<div class="chips">'+S.idxs.map(i => '<span class="chip">'+esc(DATA[i].w)+'</span>').join("")+'</div>'+
      '<a class="wi" href="'+WI_URL+'" target="_blank" rel="noopener noreferrer">افتح Write &amp; Improve</a>'+
      '<div class="task">لو ما فهمت تصحيحاً، اكتب الجملة في ملف أخطائك وراجعها بعد يوم. وإذا خلصت، اضغط «خلصت الدرس» لحفظ تقدمك.</div>'+
      ((S.finished || !S.quiz.length) ? '' : '<p class="note" style="margin-top:12px">أنهِ الاختبار أولاً عشان تقدر تخلص الدرس.</p>');
  }

  app.innerHTML = html;
  $("back").addEventListener("click", renderHome);
  if (app.querySelector){ const w = app.querySelector(".why"); if (w && w.scrollIntoView) w.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  app.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => goStep(+b.dataset.s)));
  if ($("tr-t")) $("tr-t").addEventListener("click", () => { S.showTr = !S.showTr; renderLesson(); });
  app.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => {
    if (S.picked >= 0) return;
    S.picked = +b.dataset.o; if (S.picked === S.quiz[S.qi].a) S.score++;
    renderLesson();
  }));

  const last = S.steps.length - 1;
  if (key === "words") setDock("التالي", () => goStep(S.step+1), false);
  else if (key === "text") setDock("التالي", () => goStep(S.step+1), false, "السابق", () => goStep(S.step-1));
  else if (key === "quiz"){
    if (!S.quiz.length) setDock("التالي", () => goStep(S.step+1), false, "السابق", () => goStep(S.step-1));
    else if (S.finished){
      setDock("التالي: اكتب", () => goStep(S.step+1), false, "أعد الاختبار", () => {
        S.quiz = prepQuiz(S.quiz.map(q => ({t:q.t, o:q.o, a:q.a, e:q.e}))); S.qi = 0; S.score = 0; S.picked = -1; S.finished = false; renderLesson();
      });
    } else {
      const lastQ = S.qi === S.quiz.length - 1;
      setDock(lastQ ? "عرض النتيجة" : "السؤال التالي", () => {
        if (lastQ){ S.finished = true; } else { S.qi++; S.picked = -1; }
        renderLesson(); window.scrollTo(0,0);
      }, S.picked < 0);
    }
  }
  else if (key === "write") setDock("خلصت الدرس ✓", finishLesson, !(S.finished || !S.quiz.length), "السابق", () => goStep(S.step-1));
}

function finishLesson(){
  const s = new Set(prog.learned); S.idxs.forEach(i => s.add(i)); prog.learned = [...s];
  if (S.kind === "fixed"){
    const old = prog.lessons[S.id];
    const best = Math.max(S.score, old && old.score ? old.score : 0);
    prog.lessons[S.id] = {done:true, score: S.finished || best ? best : 0};
  }
  saveProg(); S.done = true; renderDone();
}

function renderDone(){
  const app = $("app"); const total = S.quiz.length;
  app.innerHTML = '<h1>خلصت الدرس</h1><p class="sub">'+esc(S.title)+'</p>'+
    (total ? '<div class="result">'+S.score+' من '+total+'</div>' : '')+
    '<p class="note">تم حفظ تقدمك. راجع كلمات هذا الدرس بعد يوم، ثم بعد ثلاثة أيام.</p>';
  const nextLesson = S.kind === "fixed" ? LESSONS.find(l => !(prog.lessons[l.id] && prog.lessons[l.id].done)) : null;
  if (nextLesson) setDock("الدرس التالي", () => startFixed(nextLesson), false, "الرئيسية", renderHome);
  else if (S.kind === "random") setDock("٥ كلمات جديدة", startRandom, false, "الرئيسية", renderHome);
  else setDock("الرئيسية", renderHome, false);
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>
